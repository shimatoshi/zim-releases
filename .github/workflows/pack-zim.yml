name: pack-zim
# content/<slug>.html を検索付きZIMにパックし、GitHub Release として公開する。
# hikigaeru(DeepSeek) が HTML を push → `gh workflow run pack-zim.yml -f slug=<slug>` で発火。
on:
  push:
    paths:
      - "content/gpt-ci-test-20260928.html"
  workflow_dispatch:
    inputs:
      slug:
        description: "content/<slug>.html の slug"
        required: true
      title:
        description: "ZIMタイトル(省略時は<title>から)"
        required: false
        default: ""
      lang:
        description: "言語(ja/en)"
        required: false
        default: "ja"

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install libzim
        run: pip install libzim
      - name: pack ZIM
        id: pack
        run: |
          set -e
          SLUG="${{ github.event_name == 'push' && 'gpt-ci-test-20260928' || github.event.inputs.slug }}"
          IN="content/${SLUG}.html"
          OUT="${SLUG}.zim"
          test -f "$IN" || { echo "::error::$IN が無い"; exit 1; }
          LANG_INPUT="${{ github.event.inputs.lang }}"
          [ -z "$LANG_INPUT" ] && LANG_INPUT="ja"
          ARGS=(--lang "$LANG_INPUT")
          TITLE_INPUT="${{ github.event_name == 'push' && 'GPT CI ZIM test 2026-09-28' || github.event.inputs.title }}"
          if [ -n "$TITLE_INPUT" ]; then ARGS+=(--title "$TITLE_INPUT"); fi
          python3 zim_pack.py "$IN" "$OUT" "${ARGS[@]}"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"
      - name: publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SLUG="${{ github.event_name == 'push' && 'gpt-ci-test-20260928' || github.event.inputs.slug }}"
          TITLE="${{ github.event_name == 'push' && 'GPT CI ZIM test 2026-09-28' || github.event.inputs.title }}"
          [ -z "$TITLE" ] && TITLE="$SLUG"
          # 既存タグがあれば差し替え
          gh release delete "$SLUG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$SLUG" "${{ steps.pack.outputs.out }}" \
            --title "$TITLE" --notes "auto-packed by hikigaeru pack-zim CI"
          echo "released: $(gh release view "$SLUG" --json url -q .url)"
